<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>弈生圍棋教室 寒暑假課程試算</title><meta name="description" content="弈生圍棋教室寒暑假課程費用試算：選好上課日期，馬上看到費用與優惠。"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap"></head><body><style>
/* 版面：左欄＝會員名稱＋課程菜單＋週曆，右欄＝黏附的費用明細；窄螢幕改單欄，底部固定合計列。
   圖像語彙：棋子（上午＝黑子、下午＝白子、才藝＝黃子）與菜單式的虛線引導點。 */
:root{
  --bg:#E6E6E8; --surface:#FFFFFF; --field:#FFFFFF; --ink:#111214; --muted:#4B515A; --line:#CBCED4;
  --dots:#6F9CC9; --dashed:#9AA3AE; --grid:rgba(255,255,255,.45); --scrim:rgba(255,255,255,.78);
  --alert:#C62828; --accent:#1560A2; --accent-bg:#FFEBB0; --board:#F7B731;
  --good:#1D6847; --good-bg:#DCEEE3; --danger:#B3261E;
  --blue:#1560A2; --yellow:#F7B731; --coral:#C94334; --pill-bg:#111214; --pill-ink:#FFFFFF;
  --stone-b:#111214; --stone-b-ink:#FFFFFF; --stone-b-edge:#111214;
  --stone-w:#FFFFFF; --stone-w-ink:#111214; --stone-ring:#8E959E;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1822; --surface:#14283A; --field:#0D1822; --ink:#F1F4F8; --muted:#A9B7C6; --line:#2B4257;
    --dots:#4F7BA6; --dashed:#4F6479; --grid:rgba(255,255,255,.06); --scrim:rgba(20,40,58,.8);
    --alert:#FF8A7A; --accent:#F7B731; --accent-bg:#3A3012; --board:#4A3A10;
    --good:#7ED0A6; --good-bg:#17301F; --danger:#FF8A7A;
    --blue:#1F6FB5; --yellow:#F7B731; --coral:#FF9A8B; --pill-bg:#F7B731; --pill-ink:#111214;
    --stone-b:#050706; --stone-b-ink:#EAEEE7; --stone-b-edge:#8795A3;
    --stone-w:#EEF1F5; --stone-w-ink:#111214; --stone-ring:#EEF1F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1822; --surface:#14283A; --field:#0D1822; --ink:#F1F4F8; --muted:#A9B7C6; --line:#2B4257;
  --dots:#4F7BA6; --dashed:#4F6479; --grid:rgba(255,255,255,.06); --scrim:rgba(20,40,58,.8);
  --alert:#FF8A7A; --accent:#F7B731; --accent-bg:#3A3012; --board:#4A3A10;
  --good:#7ED0A6; --good-bg:#17301F; --danger:#FF8A7A;
  --blue:#1F6FB5; --yellow:#F7B731; --coral:#FF9A8B; --pill-bg:#F7B731; --pill-ink:#111214;
  --stone-b:#050706; --stone-b-ink:#EAEEE7; --stone-b-edge:#8795A3;
  --stone-w:#EEF1F5; --stone-w-ink:#111214; --stone-ring:#EEF1F5;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px;padding-block:20px 120px}

/* 頁首：棋盤格線底，可換成自己的背景圖（加淡色遮罩讓文字清楚） */
.top{border:1px solid var(--line);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.top.hasbg{background-size:cover;background-position:center;background-repeat:no-repeat}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.top h1{font-size:clamp(26px,5.5vw,36px)}
.lead{color:var(--muted);max-width:40em}
.top.hasbg .lead{color:var(--ink)}
.demo{width:fit-content;max-width:100%;background:var(--accent-bg);color:var(--accent);font-size:13px;padding:4px 10px;border-radius:4px}

.seasons{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px}
.tab{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;min-height:44px}
.tab small{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.8}

.layout{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.main{display:flex;flex-direction:column;gap:30px;min-width:0}
.sec h2{font-size:19px}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.member{display:flex;flex-direction:column;gap:6px}
.member input{max-width:360px}

/* 菜單 */
.menucols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:12px}
.mcol h3{font-size:15px;display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.mcol h3{flex-wrap:wrap}.hl{margin-top:12px;font-size:16px;font-weight:700;color:var(--alert);background:none;padding:0;line-height:1.5;animation:blink 1.4s ease-in-out infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}.mcol h3 small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted)}
.item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;padding:10px 8px;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;border-radius:6px}
.item.on{background:var(--accent-bg);border-color:var(--accent)}
.itbody{display:flex;flex-direction:column;min-width:0}
.per{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}

.row{display:flex;align-items:baseline;gap:8px}
.row .lbl{min-width:0;overflow-wrap:anywhere;font-weight:500}
.dots{flex:1 1 12px;min-width:12px;border-bottom:2px dotted var(--dots);transform:translateY(-4px)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}

/* 棋子 */
.stone{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:12px;font-weight:700;line-height:1;letter-spacing:0}
.stone{white-space:nowrap}
.early{margin-top:12px}.early .disc,.early .disc:last-child{border:0;background:none;padding:0;margin:0}.early .disc .lbl,.early .disc .amt{font-weight:800;color:var(--ink)}
.stone.b{background:var(--stone-b);color:var(--stone-b-ink);box-shadow:inset 0 0 0 1.5px var(--stone-b-edge)}
.stone.w{background:var(--stone-w);color:var(--stone-w-ink);box-shadow:inset 0 0 0 1.5px var(--stone-ring)}
.stone.x{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.stone.e{background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--dashed);font-weight:400}

/* 日曆 */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.note{background:var(--accent-bg);color:var(--accent);font-size:13px;padding:8px 12px;border-radius:6px;margin-top:12px}
.weeks{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.week{display:flex;flex-direction:column;gap:6px}
.weekhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.days{display:grid;gap:4px}
.day{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 2px;display:flex;flex-direction:column;align-items:center;min-width:0}
.day.void{border:0;background:transparent}
.dtop{display:flex;justify-content:space-between;width:100%;padding-inline:4px;font-size:11px;color:var(--muted)}
.dtop .dd{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.day.closed{background-color:var(--bg);background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);color:var(--muted)}
.cl{font-size:12px;padding:16px 2px;text-align:center}
.slot{display:grid;place-items:center;width:100%;min-height:40px;border:0;background:transparent;border-radius:6px;cursor:pointer;padding:2px 0}
.slot:hover:not(:disabled){background:var(--bg)}
.slot:disabled{cursor:not-allowed;opacity:.5}
.slot .stone{width:30px;height:30px}
.shut{display:grid;place-items:center;width:100%;min-height:40px;border-radius:6px;font-size:12px;color:var(--muted);background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.xwide{grid-column:1/-1}
.xgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),auto);grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
@media (max-width:640px){.xgrid{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:minmax(0,1fr)}}
.offer{font-size:11px;line-height:1.2;color:var(--muted);text-align:center;padding:2px;word-break:keep-all}
.dnote{font-size:11px;line-height:1.3;color:var(--accent);text-align:center;padding:0 2px 3px;font-weight:700}
.dayadm{display:flex;flex-direction:column;gap:6px}
.drow{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.drow .dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dgrp{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px}
.dgrp > .lbl2{min-width:4.5em;font-size:12.5px;color:var(--muted)}
.dgrp small{font-size:12px;color:var(--muted)}

/* 費用 */
.quote{border:1px solid var(--line);background:var(--surface);padding:18px;border-radius:8px;min-width:0}
.quote h2{font-size:20px}
.quote h3{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:18px 0 6px}
.lines{display:flex;flex-direction:column;gap:6px}
.subtotal{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.disc{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.disc:last-child{border-bottom:0}
.disc .d{font-size:12.5px;color:var(--muted)}
.disc .h{font-size:12.5px;color:var(--muted)}
.disc.applied .h{color:var(--good);font-weight:700}
.disc.applied .amt{color:var(--good)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--line);border-radius:3px;color:var(--muted);margin-left:6px;vertical-align:1px}
.dsplit{display:grid;grid-template-columns:1fr 1fr;width:100%}@media (max-width:560px){.dsplit .slot .stone{width:25px;height:25px;font-size:11px}}.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.planbtn{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:700;cursor:pointer}.planbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tierbox{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}.others{margin-top:12px}.tiers{list-style:none;margin:4px 0 2px;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.tiers li{display:flex;gap:8px;align-items:baseline}
.tiers li::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dashed);flex:none;transform:translateY(-1px)}
.tiers li.on{color:var(--ink);font-weight:700}
.tiers li.on::before{background:var(--accent);border-color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.total{margin-top:18px;padding:14px;background:var(--board);color:var(--ink);border-radius:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tprice{display:flex;align-items:baseline;justify-content:flex-end;flex-wrap:wrap;gap:4px 14px;margin-left:auto}
.orig{display:inline-block;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-decoration:line-through;text-decoration-thickness:2px}
.total.sale{align-items:center}
.total.sale strong{font-size:32px;color:var(--alert)}
.total strong{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.saved{color:var(--good);font-size:13.5px;margin-top:8px;font-weight:700}
.copy{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.copy textarea{width:100%;min-height:150px}
.fine{font-size:12.5px;color:var(--muted)}
.foot{margin-top:30px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}
.foot ul{margin:0;padding-left:1.2em}

.btn{padding:8px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;font-weight:700;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 12px;font-size:13px;min-height:34px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}

.sumbar,.abar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.sumbar strong{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.sumbar small{color:var(--good);margin-left:8px;font-weight:700}
.sumbar .barl{color:var(--muted);font-size:13px;margin-right:6px}
.amsg{font-size:13px;color:var(--muted);min-width:0;flex:1}
.abtns{display:flex;gap:8px;flex:none}

@media (min-width:920px){
  .layout{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  .quote{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto}
  .sumbar{display:none}
  .wrap{padding-block:20px 60px}
  .wrap.admin{padding-block:20px 120px}
}

/* 後台 */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px}
.apanel{display:flex;flex-direction:column;gap:26px}
.agroup{display:flex;flex-direction:column;gap:12px}
.agroup > .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.agroup h2{font-size:18px}
.cards{display:grid;gap:12px}
.acard{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl2{font-size:12.5px;color:var(--muted)}
.field small{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink)}
input[type=file]{max-width:100%}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:2px 16px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.addrow .field{flex:1 1 130px}
.tierlist{display:flex;flex-direction:column;gap:8px}
.tierrow{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end;padding:10px;border:1px dashed var(--dashed);border-radius:6px}
.bgprev{height:110px;border:1px solid var(--line);border-radius:6px;background-color:var(--bg);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--muted);font-size:13px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;min-height:32px}
details.more .tools{margin-top:6px}


/* 視覺風格：弈生圍棋海報配色（黃／藍／珊瑚紅／黑白棋子），版面結構不變 */
h1,h2,h3{font-weight:800}
.top{position:relative;overflow:hidden;border:2px solid #111214;border-radius:14px;background-color:var(--yellow);
  background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;padding:22px 130px 22px 20px}
.top.hasbg{background-size:cover;padding-right:20px}
.top h1,.top .lead{color:#111214}
.top h1{font-weight:900;letter-spacing:.02em;text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.top .eyebrow{display:inline-block;width:fit-content;background:#111214;color:#fff;padding:2px 12px;border-radius:999px;letter-spacing:.12em;font-size:13px}
.top .demo{background:#111214;color:#fff}
.top::after{content:"";position:absolute;top:18px;right:20px;width:30px;height:30px;border-radius:50%;background:#111214;pointer-events:none;
  box-shadow:-40px 0 0 #111214,-80px 0 0 #fff,-60px 38px 0 #fff}
.top.hasbg::after{display:none}
@media (max-width:560px){
  .top{padding-right:84px}
  .top::after{top:14px;right:14px;width:20px;height:20px;box-shadow:-26px 0 0 #111214,-52px 0 0 #fff,-39px 26px 0 #fff}
}
.sec h2{display:inline-block;width:fit-content;background:var(--pill-bg);color:var(--pill-ink);padding:3px 16px;border-radius:999px;font-size:17px;margin-bottom:4px}
.mcol h3{border-left:5px solid var(--yellow);padding-left:8px}
.tab{border-width:1.5px;border-radius:10px}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.tab[aria-selected="true"] small{color:#fff}
.planbtn{border-width:1.5px;border-radius:10px}
.planbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.quote{border:2px solid var(--blue);border-radius:16px}
.quote h2{font-weight:900}
.tierbox{border:1.5px solid var(--blue);border-radius:10px}
.item{border-radius:10px}
.day{border-radius:8px}
.stone.x{background:var(--yellow);color:#111214;box-shadow:inset 0 0 0 1.5px #111214}
.total{border:2px solid var(--ink);border-radius:12px}
.total strong{font-weight:900}
.tag{color:var(--coral);border-color:var(--coral);font-weight:700}
.sumbar{border-top:2px solid var(--blue)}
@media (max-width:560px){.dsplit .slot{padding:2px 0;min-height:34px}.dsplit .slot .stone{width:21px;height:21px;font-size:9px;letter-spacing:-.02em}}
.days{--lw:38px}
.lab{display:flex;flex-direction:column;align-items:stretch;padding:4px 0}
.lab .ltop{font-size:11px;visibility:hidden;padding-inline:4px}
.lslot{display:grid;place-items:center;min-height:40px;font-size:12px;font-weight:800;color:var(--ink);line-height:1.2;text-align:center}
.lslot.two{gap:0;align-content:center}
.lslot.two span+span{margin-top:2px;padding-top:2px;border-top:1px dotted var(--dots)}
@media (max-width:560px){.days{--lw:26px}.lslot{font-size:10px}.lslot.two{min-height:34px}}
.btn{border-radius:999px}
.btn.sm{border-radius:999px}


/* 背景：淡藍底＋白色格線，上方黃色斜角、右下珊瑚紅斜角，大螢幕兩側有黑白棋子 */
:root{--bg:#DCE8F3;--gridb:rgba(255,255,255,.55);--wedge:#F7B731;--wedgegrid:rgba(255,255,255,.4);--wedge2:#EE6C5B;--sidestone:#FFFFFF}

/* ---------- 小工具 ---------- */
function add(el,c){
  if(c===null||c===undefined||c===false) return;

  if(c.nodeType){el.appendChild(c);return;}

function h(tag,attrs){
  var el=document.createElement(tag),later=[];
  if(attrs){Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(v===null||v===undefined||v===false) return;
    if(k==="class") el.className=v;
    else if(k.indexOf("on")===0) el.addEventListener(k.slice(2),v);
    else if(k==="value"||k==="checked"||k==="disabled"||k==="selected") later.push([k,v]);
    else el.setAttribute(k,v===true?"":String(v));
  });}
  for(var i=2;i<arguments.length;i++) add(el,arguments[i]);
  later.forEach(function(p){el[p[0]]=p[1];});
  return el;
}
function pad(n){return (n<10?"0":"")+n;}
function parseD(s){

}

/* ---------- 日期與日曆資料 ---------- */
var SLOTS3=["am","pm","x"];
/* 某一天實際開的課：有後台排課就用排課；沒有就看上課星期，平日開全部課。
   回傳 {o:{am:[課程id],pm:[…],x:[…]}, note, entry} */
function effDay(season,iso,courses){
  var e=(season.days||{})[iso],o={am:[],pm:[],x:[]};
  if(e){
    SLOTS3.forEach(function(sl){
      o[sl]=(e[sl]||[]).filter(function(id){return courses.some(function(c){return c.id===id&&c.enabled&&courseInSlot(c,sl);});});
    });
    return {o:o,note:e.note||"",entry:true,xFirst:!!e.xFirst};
  }
  var p=parseD(iso);
  if(p&&season.weekdays.indexOf(p.getDay())>=0){
    SLOTS3.forEach(function(sl){o[sl]=courses.filter(function(c){return c.enabled&&!c.special&&courseInSlot(c,sl);}).map(function(c){return c.id;});});
  }
  return {o:o,note:"",entry:false,xFirst:false};
}
function seasonWeeks(season){
  var start=parseD(season.start),end=parseD(season.end);
  if(!start||!end||start>end) return [];
  var closed={};
  (season.closed||[]).forEach(function(c){
    var m=closed[c.date]||(closed[c.date]={});
    m[(c.part==="am"||c.part==="pm"||c.part==="x")?c.part:"all"]=c.label||"休";
  });
  var days_=season.days||{};
  var cur=addDays(start,-((start.getDay()+6)%7));
  var cols=ORDER.filter(function(wd){
    if(season.weekdays.indexOf(wd)>=0) return true;
    return Object.keys(days_).some(function(iso){var p=parseD(iso);return p&&p.getDay()===wd;});
  });
  var weeks=[],guard=0;
  while(cur<=end&&guard++<90){
    var days=cols.map(function(wd){
      var dt=addDays(cur,(wd+6)%7),iso=fmtD(dt),m=closed[iso]||{};
      var inR=dt>=start&&dt<=end;
      var eff=effDay(season,iso,cfg.courses);
      return {iso:iso,wd:wd,inRange:inR,note:eff.note,xFirst:eff.xFirst,offers:eff.o,
        cl:{am:m.all||m.am||"",pm:m.all||m.pm||"",x:m.all||m.x||""}};
    });
    if(days.some(function(d){return d.inRange;})) weeks.push({days:days});
    cur=addDays(cur,7);
  }
  return weeks;
}
function slotOpenD(d,slot){return d.inRange&&!d.cl[slot]&&d.offers[slot].length>0;}

}

function openDays(season){
  var out=[];
  seasonWeeks(season).forEach(function(w){w.days.forEach(function(d){if(isOpen(d)) out.push(d.iso);});});
  return out;
}
function slotDays(season,slot){
  var out=[];
  seasonWeeks(season).forEach(function(w){w.days.forEach(function(d){if(slotOpenD(d,slot)) out.push(d.iso);});});
  return out;
}

/* ---------- 選課狀態 ---------- */
function key(iso,slot){return iso+"|"+slot;}

}
function toggleSlot(season,iso,slot){
  var s=getSel(season.id),k=key(iso,slot),d=dmCache(season)[iso];
  if(!hasName()||!d||!slotOpenD(d,slot)) return;
  var offers=d.offers[slot],cur=hasSel(season,iso,slot)?s[k]:null;

  var o=other(slot);
  if(o) delete s[key(iso,o)];
  s[k]=next;
}
function firstOffer(dm,iso,slot){var d=dm[iso];return d&&slotOpenD(d,slot)?d.offers[slot][0]:null;}
function applyEntries(season,ents){
  if(!hasName()||!ents.length) return;
  var s=getSel(season.id);
  var allOn=ents.every(function(e){return s[e[0]]===e[1];});
  if(!allOn) ents.forEach(function(e){var p=e[0].split("|"),o=other(p[1]);if(o) delete s[key(p[0],o)];});
  ents.forEach(function(e){if(allOn) delete s[e[0]]; else s[e[0]]=e[1];});
  touch();
}
function fillSlot(season,slot){
  var o=other(slot),dm=dmCache(season);
  applyEntries(season,slotDays(season,slot).map(function(iso){return [key(iso,slot),firstOffer(dm,iso,slot)];}));
}
function fillFull(season){
  var ents=[],dm=dmCache(season);
  ["am","pm"].forEach(function(sl){
    slotDays(season,sl).forEach(function(iso){
      ents.push([key(iso,sl),firstOffer(dm,iso,sl)]);

  });
  applyEntries(season,ents);

function fillWeek(season,w){
  var ents=[],dm=dmCache(season);
  w.days.forEach(function(d){["am","pm"].forEach(function(sl){
    var fo=firstOffer(dm,d.iso,sl);
    if(fo) ents.push([key(d.iso,sl),fo]);
  });});
  applyEntries(season,ents);
}

/* ---------- 計價 ---------- */
function benefit(r){
  if(r.kind==="amount") return (r.type==="fullday"?"每日折 $":"折 $")+fmtNum(r.value);
  return fmtZhe(r.value);
}
function ruleDesc(r){

  if(r.type==="fullday") return "同日上午＋下午（或才藝）"+((r.min||1)>1?"滿 "+r.min+" 天":"")+" · "+benefit(r);
  if(r.type==="earlybird") return mdw(r.until)+" 前報名 · "+benefit(r);
  if(r.type==="custom") return (r.min>0?"滿 "+r.min+" 堂 · ":"")+benefit(r);
  if(r.type==="always") return "全部學費 · "+benefit(r);
  return benefit(r);
}
function tierBenefit(t){return (t.zhe>0?fmtZhe(t.zhe):"不打折")+(t.share>0?"、分享加碼 －$"+fmtNum(t.share):"");}
function rangeText(tiers,i){
  var t=tiers[i],nx=tiers[i+1];
  if(t.minDays<=0) return nx?"全天未滿 "+nx.minDays+" 天":"全天不限";
  if(!nx) return "全天 "+t.minDays+" 天以上";
  return nx.minDays-1>t.minDays?"全天 "+t.minDays+"–"+(nx.minDays-1)+" 天":"全天 "+t.minDays+" 天";

function evalTier(r,ctx,res){
  var tiers=(r.tiers||[]).slice().sort(function(a,b){return a.minDays-b.minDays;});
  var days=ctx.fullDays.length,reached=null,next=null,i;
  res.tiers=tiers;res.tier=null;
  if(r.until&&ctx.today>r.until){res.expired=true;res.hint="已於 "+mdw(r.until)+" 截止";return res;}
  if(!tiers.length){res.hint="尚未設定各段優惠";return res;}
  if(ctx.nCore<1){res.hint="先選圍棋課（上午或下午），系統會自動判斷落在哪一段。";return res;}
  tiers.forEach(function(t){if(days>=t.minDays) reached=t;});
  for(i=0;i<tiers.length;i++){if(tiers[i].minDays>days){next=tiers[i];break;}}
  if(!reached){res.hint="全天滿 "+tiers[0].minDays+" 天即可享";return res;}
  res.tier=reached;
  var base=r.scope==="core"?ctx.Tcore:ctx.T;
  var pct=(reached.zhe>0&&reached.zhe<10)?Math.round(base*(1-reached.zhe/10)):0;
  var sh=(state.flags[r.id]&&reached.share>0)?reached.share:0;
  var parts=[];
  if(pct>0) parts.push(fmtZhe(reached.zhe)+" －$"+fmtNum(pct));
  if(sh>0) parts.push("分享加碼 －$"+fmtNum(sh));
  res.eligible=true;res.pct=pct;res.share=sh;res.saving=pct+sh;
  res.applyText="「"+reached.label+"」"+(parts.length?"："+parts.join("、"):"");
  if(!parts.length) res.hint="目前在「"+reached.label+"」這一段，沒有折扣。";
  if(reached.share>0&&!state.flags[r.id]) res.shareHint="勾選「"+(r.shareText||"分享貼文")+"」可再折 $"+fmtNum(reached.share);
  if(next) res.nextHint="再選 "+(next.minDays-days)+" 天全天，升級為「"+next.label+"」："+tierBenefit(next);
  return res;
}
function evalRule(r,ctx){
  var res={rule:r,eligible:false,saving:0,hint:"",expired:false};
  function calc(base){return r.kind==="amount"?Math.min(base,r.value):base*(1-r.value/10);}
  if(r.type==="tier") return evalTier(r,ctx,res);
  if(r.type==="share"){
    var tr=(r.tiers||[]).slice().sort(function(a,b){return a.minDays-b.minDays;}),dd=ctx.fullDays.length,pk=null;
    tr.forEach(function(t){if(dd>=t.minDays) pk=t;});
    res.tiers=tr;res.tier=pk;
    if(r.until&&ctx.today>r.until){res.expired=true;res.hint="已於 "+mdw(r.until)+" 截止";}
    else if(ctx.nCore<1) res.hint="先選圍棋課，再勾選。";
    else if(state.flags[r.id]&&pk&&pk.share>0){res.eligible=true;res.saving=Math.min(pk.share,ctx.T);}
    else res.hint=state.flags[r.id]?"目前天數沒有加碼":"勾選即可享";
    res.saving=Math.round(res.saving);
    return res;
  }
  if(r.type==="always"){
    if(ctx.n>=1){res.eligible=true;res.saving=calc(ctx.T);}
    else res.hint="選課後自動折抵";
    res.saving=Math.round(res.saving);
    return res;
  }
  if(r.type==="sessions"){
    if(ctx.n>=r.min){res.eligible=true;res.saving=calc(ctx.T);}
    else res.hint=ctx.n===0?"選滿 "+r.min+" 堂即可享":"再選 "+(r.min-ctx.n)+" 堂即可享";
  }else if(r.type==="fullday"){
    var d=ctx.fullDays.length,m=r.min||1;
    if(d>=m){
      res.eligible=true;
      var ft=ctx.fullDays.reduce(function(a,x){return a+x.t;},0);
      res.saving=r.kind==="amount"?Math.min(ft,r.value*d):ft*(1-r.value/10);
    }else res.hint=d===0?(m===1?"同一天選上午＋下午（或才藝）即可享":"選 "+m+" 天上午＋下午（或才藝）即可享"):"再選 "+(m-d)+" 天上午＋下午（或才藝）即可享";
  }else if(r.type==="earlybird"){
    if(r.until&&ctx.today<=r.until){res.eligible=true;res.saving=calc(ctx.T);}
    else{res.expired=true;res.hint="已於 "+mdw(r.until)+" 截止";}
  }else if(r.type==="flag"){
    if(state.flags[r.id]){res.eligible=true;res.saving=calc(ctx.T);}
    else res.hint="勾選即可享";
  }else if(r.type==="custom"){
    var mn=Math.max(0,r.min||0);
    if(r.needCheck&&!state.flags[r.id]) res.hint="勾選即可享";
    else if(ctx.n<Math.max(mn,1)) res.hint=mn>0?(ctx.n===0?"選滿 "+mn+" 堂即可享":"再選 "+(mn-ctx.n)+" 堂即可享"):"選課後自動折抵";
    else{res.eligible=true;res.saving=calc(ctx.T);}
  }
  res.saving=Math.round(res.saving);
  return res;
}
function quote(season){
  var dm=dmCache(season);
  var s=getSel(season.id);
  var per={},day={},n=0,T=0,nCore=0,Tcore=0,cnt={am:0,pm:0,x:0};
  Object.keys(s).forEach(function(k){
    var p=k.split("|"),iso=p[0],slot=p[1],c=courseById(s[k]);
    if(!c||!c.enabled||!courseInSlot(c,slot)||!okHere(dm,iso,slot,c.id)) return;
    if(slot==="x"&&hasSel(season,iso,"pm")) return;
    if(!per[c.id]) per[c.id]={course:c,count:0};
    per[c.id].count++;n++;T+=c.price;cnt[slot]++;
    if(slot!=="x"){nCore++;Tcore+=c.price;}
    if(!day[iso]) day[iso]={};
    day[iso][slot]=c;
  });
  var lines=[],mats=[],matTotal=0;
  cfg.courses.forEach(function(c){
    var p=per[c.id];
    if(!p) return;
    lines.push({course:c,count:p.count,amount:p.count*c.price});
    if(c.materialAmount>0){
      var every=Math.max(1,Math.floor(c.materialEvery||1));
      var times=c.materialMode==="each"?p.count:c.materialMode==="custom"?Math.ceil(p.count/every):1;
      var amt=c.materialAmount*times;
      mats.push({label:(c.materialName||c.name+"材料")+((c.materialMode==="each"||c.materialMode==="custom")?" × "+times:""),amount:amt});
      matTotal+=amt;
    }
  });
  var fullDays=[],isoList=Object.keys(day).sort();
  isoList.forEach(function(iso){var aft=day[iso].pm||day[iso].x;if(day[iso].am&&aft) fullDays.push({iso:iso,t:day[iso].am.price+aft.price});});
  var ctx={n:n,T:T,nCore:nCore,Tcore:Tcore,fullDays:fullDays,today:today()};
  var rules=(cfg.discounts||[]).filter(function(r){return r.enabled&&(!r.plan||r.plan==="all"||r.plan===state.plan)&&(!r.seasons||!r.seasons.length||r.seasons.indexOf(season.id)>=0);});
  var results=rules.map(function(r){return evalRule(r,ctx);});
  var stackable=results.filter(function(x){return x.eligible&&x.saving>0&&x.rule.stack;});
  var solo=results.filter(function(x){return x.eligible&&x.saving>0&&!x.rule.stack;}).sort(function(a,b){return b.saving-a.saving;});
  var applied=stackable.concat(solo.slice(0,1));
  solo.slice(1).forEach(function(x){x.hint="已套用較划算的「"+solo[0].rule.name+"」";x.loser=true;});
  results.forEach(function(x){if(x.eligible&&x.saving===0&&x.rule.type!=="tier") x.hint="符合資格，選課後自動折抵";});
  var disc=Math.min(T,applied.reduce(function(a,x){return a+x.saving;},0));
  return {n:n,cnt:cnt,nCore:nCore,T:T,lines:lines,mats:mats,matTotal:matTotal,results:results,applied:applied,disc:disc,total:T-disc+matTotal,saved:disc,day:day,isoList:isoList,fullDays:fullDays.length};
}
function summaryText(season,q){

  out.push("會員名稱："+String(state.member).trim());
  out.push("身分："+planName(state.plan));
  out.push("");
  q.isoList.forEach(function(iso){
    var d=q.day[iso],parts=[];
    if(d.am) parts.push("上午 "+d.am.name);
    if(d.pm) parts.push("下午 "+d.pm.name);
    if(d.x) parts.push("才藝 "+d.x.name);
    out.push(mdw(iso)+" "+parts.join("、"));
  });
  out.push("");
  q.lines.forEach(function(l){out.push(l.course.name+" × "+l.count+" 堂：NT$ "+fmtNum(l.amount));});
  out.push("學費小計：NT$ "+fmtNum(q.T));
  var shared=[];
  q.applied.forEach(function(x){
    if(x.rule.type==="tier"){
      out.push("優惠・"+x.rule.name+"（"+x.tier.label+"）：－NT$ "+fmtNum(x.saving)+(x.share>0?"（含分享加碼 －NT$ "+fmtNum(x.share)+"）":""));

  out.push("合計：NT$ "+fmtNum(q.total));
  shared.forEach(function(t){out.push("已勾選："+t);});
  return out.join("\n");
}
function doCopy(text){
  function fallback(){state.copyText=text;state.copyMsg="無法自動複製，請在下方文字框全選後複製。";render();}
  function ok(){state.copyText="";state.copyMsg="已複製，可以貼到 LINE 傳給補習班。";render();}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback);return;}
  }catch(e){}
  fallback();
}

function compressImage(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb(null);};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null);};
    img.onload=function(){
      var tries=[[1600,.8],[1400,.72],[1200,.65],[1000,.58]],i=0;
      (function step(){
        var t=tries[i],r=Math.min(1,t[0]/img.width);
        var w=Math.max(1,Math.round(img.width*r)),hh=Math.max(1,Math.round(img.height*r));
        var cv=document.createElement("canvas");cv.width=w;cv.height=hh;
        var cx=cv.getContext("2d");
        if(!cx){cb(null);return;}
        cx.fillStyle="#fff";cx.fillRect(0,0,w,hh);cx.drawImage(img,0,0,w,hh);
        var url=cv.toDataURL("image/jpeg",t[1]);
        if(url.length<=450000||i===tries.length-1){cb(url.length<=900000?url:null);}
        else{i++;step();}
      })();
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function num(v){v=Number(v);return isFinite(v)&&v>0?v:0;}
function clean(c){
  var o=JSON.parse(JSON.stringify(c));
  var sc=o.school;
  ["name","title","lead","amTime","pmTime","xTime","amNote","contact","planCustom"].forEach(function(k){sc[k]=String(sc[k]||"").trim();});
  sc.bgImage=isImg(sc.bgImage)?sc.bgImage:"";
  sc.notes=(sc.notes||[]).map(function(x){return String(x).trim();}).filter(Boolean);
  o.courses.forEach(function(x){
    x.name=String(x.name||"").trim();
    x.short=String(x.short||x.name).trim().slice(0,2);
    x.price=num(x.price);x.materialAmount=num(x.materialAmount);
    x.materialName=String(x.materialName||"").trim();
    if(["once","each","custom"].indexOf(x.materialMode)<0) x.materialMode="once";
    x.materialEvery=Math.max(1,Math.floor(num(x.materialEvery)||1));
    x.slotCustom=!!x.slotCustom;x.timeText=String(x.timeText||"").trim().slice(0,30);
    if(SLOTS.indexOf(x.slot)<0) x.slot="am";
  });
  o.seasons.forEach(function(s){
    s.name=String(s.name||"").trim();
    s.weekdays=ORDER.filter(function(d){return s.weekdays.indexOf(d)>=0;});
    s.closed=s.closed.filter(function(c1){return parseD(c1.date);}).map(function(c1){
      if(c1.part!=="am"&&c1.part!=="pm"&&c1.part!=="x") delete c1.part;
      return c1;
    }).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    var cids=o.courses.map(function(x){return x.id;});
    var days={};
    Object.keys(s.days||{}).forEach(function(iso){
      if(!parseD(iso)) return;
      var e=s.days[iso]||{},ne={};
      SLOTS3.forEach(function(sl){ne[sl]=(e[sl]||[]).filter(function(id){return cids.indexOf(id)>=0;});});
      ne.note=String(e.note||"").trim();if(e.xFirst) ne.xFirst=true;
      days[iso]=ne;
    });
    s.days=days;
  });
  var ids=o.seasons.map(function(s){return s.id;});
  o.discounts.forEach(function(r){
    r.name=String(r.name||"").trim();r.value=num(r.value);r.min=num(r.min)||(r.type==="fullday"?1:r.min);
    r.note=String(r.note||"").trim();
    r.plan=r.plan==="kyu"||r.plan==="dan"||r.plan==="cust"?r.plan:"all";
    if(r.type==="custom"){r.needCheck=!!r.needCheck;r.min=Math.floor(num(r.min));}
    r.seasons=(r.seasons||[]).filter(function(i){return ids.indexOf(i)>=0;});
    if(r.type==="share"){r.until=String(r.until||"");}
    if((r.type==="tier"||r.type==="share")){
      r.shareText=String(r.shareText||"").trim()||"分享貼文";
      r.scope=r.scope==="core"?"core":"all";
      r.until=String(r.until||"");
      r.tiers=(r.tiers||[]).map(function(t){
        return {label:String(t.label||"").trim(),minDays:Math.floor(num(t.minDays)),zhe:num(t.zhe),share:num(t.share)};
      }).sort(function(a,b){return a.minDays-b.minDays;});
    }
  });
  return o;
}
function validate(c){
  var e=[];
  if(!c.school.name) e.push("請填補習班名稱");
  if(!c.seasons.length) e.push("至少需要一個學期");
  c.seasons.forEach(function(s){
    if(!s.name) e.push("有學期沒有名稱");
    if(!parseD(s.start)||!parseD(s.end)||s.start>s.end) e.push("「"+(s.name||"未命名")+"」的開始日與結束日不正確");
    if(!s.weekdays.length) e.push("「"+(s.name||"未命名")+"」至少要選一個上課星期");
  });
  c.courses.forEach(function(x){
    if(!x.name) e.push("有課程沒有名稱");
    if(x.enabled&&x.price<0) e.push("「"+x.name+"」的學費不能小於 0");
  });
  if(!c.courses.some(function(x){return x.enabled&&(x.slot==="am"||x.slot==="pm"||x.slot==="ampm");})) e.push("至少要有一門上架的上午或下午課程");
  if(c.discounts.some(function(r){return r.enabled&&r.plan==="cust";})&&!c.school.planCustom) e.push("請填「自訂身分」的名稱");
  c.discounts.forEach(function(r){
    if(!r.name) e.push("有優惠沒有名稱");
    if((r.type==="tier"||r.type==="share")){
      if(!r.enabled) return;
      if(!r.tiers.length) e.push("「"+r.name+"」至少要有一段");
      var seen={};
      r.tiers.forEach(function(t){
        if(!t.label) e.push("「"+r.name+"」有一段沒有名稱");
        if(t.zhe>=10) e.push("「"+r.name+"」的折數要小於 10（0 = 不打折）");
        if(seen[t.minDays]) e.push("「"+r.name+"」有兩段的天數起點相同（"+t.minDays+" 天）");
        seen[t.minDays]=1;
      });
      if(r.until&&!parseD(r.until)) e.push("「"+r.name+"」的截止日不正確");
      return;
    }
    if(r.enabled&&r.value<=0) e.push("「"+r.name+"」的折數或金額要大於 0");
    if(r.enabled&&r.kind==="zhe"&&r.value>=10) e.push("「"+r.name+"」的折數要小於 10");
    if(r.enabled&&r.type==="earlybird"&&!parseD(r.until)) e.push("「"+r.name+"」請選截止日");
  });
  return e;
}
